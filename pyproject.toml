[project]
name = "lausuntobotti"
version = "0.4.0a1"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "anthropic>=0.102.0",
    "python-dotenv>=1.2.2",
    "resend>=2.30.1",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.152.7",
    "mutmut>=3.5.0",
    "pre-commit>=4.6.0",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.13",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "B", "PL", "UP"]
ignore = [
    "E501",    # line too long – HTML templates make this unavoidable
    "PLR2004", # magic-value-comparison – noisy for test assertions and score checks
]

[tool.coverage.run]
branch = true
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "pragma: no cover",
]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"
include = ["main.py", "config.py", "clients", "delivery", "processing", "tests", "scripts"]
exclude = ["**/__pycache__", "**/.*", ".venv", "mutants", "**/node_modules"]
reportMissingTypeStubs = false
strict = ["processing"]

[tool.mutmut]
paths_to_mutate = ["main.py", "processing/llm_scorer.py"]
also_copy = ["clients", "delivery", "config.py", "processing", "state_store.py", "utils", "workflows"]
tests_dir = ["tests"]
runner = "uv run --extra dev pytest -q"
do_not_mutate = [
    "if __name__ == \"__main__\":"
]
